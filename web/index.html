<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stegano Tool — Aether OS</title>
<style>
:root{color-scheme:dark;--bg:#0f0f10;--surface:#19191b;--surface2:#222225;--text:#f5f5f5;--muted:#aaaab0;--accent:#ff9d72;--radius:28px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#24201e 0,#0f0f10 45%);color:var(--text);font:15px system-ui,-apple-system,sans-serif;min-height:100vh}
main{max-width:720px;margin:auto;padding:34px 20px 60px}.brand{text-align:center;padding:28px 0 25px}.brand h1{font-size:34px;letter-spacing:-.8px;margin:0;font-weight:750}.brand p{margin:7px 0;color:#fff;font-size:13px;opacity:.75}
.card{background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid #303034;border-radius:var(--radius);padding:22px;margin:14px 0;box-shadow:0 18px 60px #0003}
h2{font-size:19px;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 18px}
.drop{border:1px dashed #57575d;border-radius:24px;padding:28px;text-align:center;background:var(--surface2);cursor:pointer;display:block}.drop:hover{border-color:var(--accent)}
input[type=file]{display:none}.file{margin-top:12px;color:var(--muted);word-break:break-all}.btn{border:0;border-radius:999px;padding:13px 18px;background:var(--accent);color:#1b120e;font-weight:750;cursor:pointer;margin:6px 4px 0 0;text-decoration:none;display:inline-block}.btn.secondary{background:#303035;color:var(--text)}.btn[disabled]{opacity:.5;pointer-events:none}.row{display:flex;gap:10px;flex-wrap:wrap}.status{margin-top:15px;color:var(--muted);white-space:pre-wrap;word-break:break-word}.hidden{display:none}label.fld{display:block;margin:12px 0 5px;color:var(--muted)}input[type=password]{width:100%;padding:13px 15px;border-radius:16px;border:1px solid #444449;background:#111113;color:#fff}
.dl{margin-top:14px}.dl a{color:#1b120e}.stamp{text-align:center;color:#6c6c74;font-size:11px;margin-top:26px;letter-spacing:.4px}
</style>
</head>
<body><main>
<section class="brand"><h1>STEGANO TOOL</h1><p>by Aether OS</p></section>
<section class="card"><h2>Hide file</h2><p class="sub">Choose a PNG image, then choose any file to embed.</p>
<label class="drop" for="image">Choose image<input id="image" type="file" accept="image/png,image/*"></label>
<div class="file" id="imageName">No image selected</div>
<label class="drop" for="payload">Choose file<input id="payload" type="file"></label>
<div class="file" id="payloadName">No file selected</div>
<label class="fld" for="password">Password (optional)</label><input id="password" type="password" placeholder="Leave blank for no encryption">
<div class="row"><button class="btn" id="hideBtn" onclick="send('hide')">Hide file</button><button class="btn secondary" id="inspectBtn" onclick="send('inspect')">Inspect image</button></div>
<div class="status" id="status"></div></section>
<section class="card"><h2>Extract / clean</h2><p class="sub">Use the selected PNG as the carrier.</p>
<div class="row"><button class="btn" id="extractBtn" onclick="send('extract')">Extract embedded file</button><button class="btn secondary" id="removeBtn" onclick="send('remove')">Remove embedded data</button></div>
<div class="status" id="status2"></div></section>
<div class="stamp" id="stamp">v1.1.0 · build 2026-11-24</div>
</main>
<script>
const $=id=>document.getElementById(id);
const VERSION='1.1.0';
const BUILD='2026-11-24';
$('stamp').textContent=`v${VERSION} · build ${BUILD}`;
$('image').onchange=()=>{$('imageName').textContent=describe($('image').files[0])};
$('payload').onchange=()=>{$('payloadName').textContent=describe($('payload').files[0])};
function describe(f){return f?`${f.name} — ${f.type||'unknown'} — ${f.size.toLocaleString()} bytes`:'No file selected'}
function busy(on){
  ['hideBtn','inspectBtn','extractBtn','removeBtn'].forEach(id=>{$(id).disabled=on});
}
function setStatus(action,text){
  const box=(action==='hide'||action==='inspect')?$('status'):$('status2');
  box.innerHTML='';
  const p=document.createElement('div');p.textContent=text;box.appendChild(p);
  return box;
}
async function send(action){
 const box=(action==='hide'||action==='inspect')?$('status'):$('status2');
 box.innerHTML='';
 const im=$('image').files[0];
 if(!im){setStatus(action,'Select a PNG image first.');return}
 const fd=new FormData();fd.append('action',action);
 fd.append('image',im);fd.append('password',$('password').value);
 if(action==='hide'){const p=$('payload').files[0];if(!p){setStatus(action,'Select a file to embed.');return}fd.append('payload',p)}
 setStatus(action,'Working…');busy(true);
 try{
   const r=await fetch('/',{method:'POST',body:fd});
   const j=await r.json();
   if(!j.ok){setStatus(action,'Error: '+j.error);return}
   if(action==='inspect'){
     const pre=document.createElement('pre');
     pre.style.margin='0';pre.style.whiteSpace='pre-wrap';
     pre.textContent=JSON.stringify(j.data,null,2);
     setStatus(action,'').appendChild(pre);return;
   }
   const box2=setStatus(action,`Done: ${j.file} — ${(j.size||0).toLocaleString()} bytes`);
   const a=document.createElement('a');
   a.className='btn dl';a.href=j.download;a.setAttribute('download',j.file);
   a.textContent='Download '+j.file;
   box2.appendChild(a);
 }catch(e){setStatus(action,'Error: '+e)}
 finally{busy(false)}
}
</script></body></html>
