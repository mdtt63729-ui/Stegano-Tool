<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stegano Tool — Aether OS</title>
<style>
:root{color-scheme:dark;--bg:#0f0f10;--surface:#19191b;--surface2:#222225;--text:#f5f5f5;--muted:#aaaab0;--accent:#ff9d72;--radius:28px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#24201e 0,#0f0f10 45%);color:var(--text);font:15px system-ui,-apple-system,sans-serif;min-height:100vh}
main{max-width:720px;margin:auto;padding:34px 20px 60px}.brand{text-align:center;padding:28px 0 25px}.brand h1{font-size:34px;letter-spacing:-.8px;margin:0;font-weight:750}.brand p{margin:7px 0;color:#fff;font-size:13px;opacity:.75}
.card{background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid #303034;border-radius:var(--radius);padding:22px;margin:14px 0;box-shadow:0 18px 60px #0003}
h2{font-size:19px;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 18px}
.drop{border:1px dashed #57575d;border-radius:24px;padding:28px;text-align:center;background:var(--surface2);cursor:pointer}.drop:hover{border-color:var(--accent)}
input[type=file]{display:none}.file{margin-top:12px;color:var(--muted);word-break:break-all}.btn{border:0;border-radius:999px;padding:13px 18px;background:var(--accent);color:#1b120e;font-weight:750;cursor:pointer;margin:6px 4px 0 0}.btn.secondary{background:#303035;color:var(--text)}.row{display:flex;gap:10px;flex-wrap:wrap}.status{margin-top:15px;color:var(--muted);white-space:pre-wrap}.hidden{display:none}label{display:block;margin:12px 0 5px;color:var(--muted)}input[type=password]{width:100%;padding:13px 15px;border-radius:16px;border:1px solid #444449;background:#111113;color:#fff}
</style>
</head>
<body><main>
<section class="brand"><h1>STEGANO TOOL</h1><p>by Aether OS</p></section>
<section class="card"><h2>Hide file</h2><p class="sub">Choose a PNG image, then choose any file to embed.</p>
<label class="drop" id="imgDrop">Choose image<input id="image" type="file" accept="image/png,image/*"></label>
<div class="file" id="imageName">No image selected</div>
<label class="drop" id="payloadDrop">Choose file<input id="payload" type="file"></label>
<div class="file" id="payloadName">No file selected</div>
<label>Password (optional)</label><input id="password" type="password" placeholder="Leave blank for no encryption">
<div class="row"><button class="btn" onclick="send('hide')">Hide file</button><button class="btn secondary" onclick="send('inspect')">Inspect image</button></div>
<div class="status" id="status"></div></section>
<section class="card"><h2>Extract / clean</h2><p class="sub">Use the selected PNG as the carrier.</p>
<div class="row"><button class="btn" onclick="send('extract')">Extract embedded file</button><button class="btn secondary" onclick="send('remove')">Remove embedded data</button></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
$('image').onchange=()=>{$('imageName').textContent=describe($('image').files[0])};
$('payload').onchange=()=>{$('payloadName').textContent=describe($('payload').files[0])};
function describe(f){return f?`${f.name} — ${f.type||'unknown'} — ${f.size.toLocaleString()} bytes`:'No file selected'}
async function send(action){
 const fd=new FormData();fd.append('action',action);
 const im=$('image').files[0];if(!im){$('status').textContent='Select an image first.';return}
 fd.append('image',im);fd.append('password',$('password').value);
 if(action==='hide'){const p=$('payload').files[0];if(!p){$('status').textContent='Select a file to embed.';return}fd.append('payload',p)}
 $('status').textContent='Working…';
 try{const r=await fetch('/',{method:'POST',body:fd});const j=await r.json();$('status').textContent=j.ok?JSON.stringify(j.data||j,null,2):'Error: '+j.error}catch(e){$('status').textContent='Error: '+e}
}
</script></body></html>
